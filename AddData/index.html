<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SendData for myProxy</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 1024px;
      padding: 10px;
      background-color: #f4f4f9;
      color: #333;
    }

    .wrapper-page {
      margin: 0 auto;
      display: inline-block;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .new-site-alert {
      color: #bdbdbd;
      max-width: 400px;
      margin: 1rem auto;
    }

    h1 {
      color: rgb(2, 2, 216);
      text-align: center;
    }

    label {
      text-align: center;
      color: #084cdf;
    }

    input {
      margin: 4px;
      display: block;
      width: 100%;
      padding: 0.375rem 0.75rem;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.5;
      color: #212529;
      background-color: #fff;
      background-clip: padding-box;
      border: 1px solid #bdbdbd;
      border-radius: 0.25rem;
      transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    input[type="file"] {
      width: 350px;
      max-width: 100%;
      color: #444;
      padding: 5px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #555;
    }

    input[type="file"]::file-selector-button {
      margin-right: 20px;
      border: none;
      background: #084cdf;
      padding: 10px 20px;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s ease-in-out;
    }

    input[type="file"]::file-selector-button:hover {
      background: #0d45a5;
    }

    .import-status {
      max-width: 500px;
      margin: 1rem auto;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="wrapper-page">
    <h1>Импорт списков сайтов в расширение Proxy Manager</h1>
    <label class="input__label" for="file">Выберите экспортированный файл
      <input type="file" id="file" name="file" accept=".txt,.json,application/json,text/plain" />
    </label>
    <p id="importStatus" class="import-status" role="status" aria-live="polite">
      Выберите файл, экспортированный из Proxy Manager.
    </p>
  </div>

  <script src="import.js" defer></script>
</body>

</html>
